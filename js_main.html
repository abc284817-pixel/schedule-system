<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch, nextTick } = Vue;


createApp({
  setup() {
    const core = useCoreModule();
    const avail = useAvailabilityModule(core);
    const roster = useMyRosterModule(core);
    const leave = useLeaveModule(core, avail);
    const summary = useManagerSummaryModule(core, avail);
    const schedAdmin = useScheduleAdminModule(core, avail);


    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1;
    const currentYm = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
    const rosterYearMonth = ref(currentYm);
    const isRefreshingRoster = ref(false);


    // 智慧排班確認視窗狀態
    const autoScheduleConfirmation = ref({
      visible: false,
      yearMonth: "",
      message: ""
    });


    const fullHistoricalMonths = computed(() => {
      const list = [];
      let y = 2024, m = 2;
      const maxDate = new Date(currentYear, currentMonth + 2, 1);


      while (
        y < maxDate.getFullYear() ||
        (y === maxDate.getFullYear() && m <= (maxDate.getMonth() + 1))
      ) {
        const mStr = String(m).padStart(2, '0');
        const ymVal = `${y}-${mStr}`;


        list.push({
          value: ymVal,
          label: `${y} 年 ${mStr} 月`
        });


        m++;
        if (m > 12) {
          m = 1;
          y++;
        }
      }


      return list.reverse();
    });


    const allSystemMonths = computed(() => fullHistoricalMonths.value);
    const windowStartIndex = ref(0);
    const windowedMonths = computed(() =>
      fullHistoricalMonths.value.slice(windowStartIndex.value, windowStartIndex.value + 6)
    );
    const canShiftNewer = computed(() => windowStartIndex.value > 0);
    const canShiftOlder = computed(() =>
      windowStartIndex.value + 6 < fullHistoricalMonths.value.length
    );
    const isManagerMonthInWindow = computed(() =>
      windowedMonths.value.some(m => m.value === summary.managerYearMonth.value)
    );
    const isRosterMonthInWindow = computed(() =>
      windowedMonths.value.some(m => m.value === rosterYearMonth.value)
    );
    const isScheduleMonthInWindow = computed(() =>
      windowedMonths.value.some(m => m.value === schedAdmin.scheduleTargetYearMonth.value)
    );


    const shiftWindowNewer = () => {
      if (canShiftNewer.value) {
        windowStartIndex.value = Math.max(0, windowStartIndex.value - 6);
        syncMonthsAfterWindowShift();
      }
    };


    const shiftWindowOlder = () => {
      if (canShiftOlder.value) {
        windowStartIndex.value = Math.min(
          fullHistoricalMonths.value.length - 6,
          windowStartIndex.value + 6
        );
        syncMonthsAfterWindowShift();
      }
    };


    const syncMonthsAfterWindowShift = () => {
      const topMonth = windowedMonths.value[0]?.value;
      if (!topMonth) return;


      if (!isManagerMonthInWindow.value) {
        summary.managerYearMonth.value = topMonth;
      }


      if (!isRosterMonthInWindow.value) {
        rosterYearMonth.value = topMonth;
        loadRosterForMonth(rosterYearMonth.value);
      }


      if (!isScheduleMonthInWindow.value) {
        schedAdmin.scheduleTargetYearMonth.value = topMonth;
        onScheduleMonthChange();
      }
    };


const dynamicHolidays = ref({});
  
    const fetchDynamicHolidays = () => {
      google.script.run
        .withSuccessHandler(res => {
          dynamicHolidays.value = res;
        })
        .apiGetDynamicHolidays();
    };
    
    // 初始化時立刻去後端抓取資料表
    fetchDynamicHolidays();

    const getHolidayInfo = (dateStr) => {
      const d = CalendarUtils.normalizeDateStr(dateStr);
      return dynamicHolidays.value[d] || null;
    };

// ==========================================
    // 👇 請在這裡新增：工時結算狀態鎖與觸發函數 👇
    // ==========================================
    const isRecalculating = ref(false);

    const handleRecalculateStats = () => {
      if (isRecalculating.value) return; 
      isRecalculating.value = true;
      
      google.script.run
        .withSuccessHandler(res => {
          isRecalculating.value = false;
          // 呼叫你的排班重載函數，讓畫面上的數字自動刷新
          schedAdmin.fetchScheduleData(schedAdmin.scheduleTargetYearMonth.value, true);
          if (core.triggerStickyAlert) {
            core.triggerStickyAlert(`✅ 結算完成！已重新校正 ${res.count} 筆雙薪與工時紀錄。`, "success");
          } else {
            alert(`✅ 結算完成！共校正 ${res.count} 筆資料。`);
          }
        })
        .withFailureHandler(err => {
          isRecalculating.value = false;
          if (core.triggerStickyAlert) {
            core.triggerStickyAlert("❌ 結算失敗：" + err.message, "error");
          } else {
            alert("❌ 結算失敗：" + err.message);
          }
        })
        .apiRecalculateMonthlyStats();
    };

    const handleLogin = () => {
      core.loginError.value = "";


      if (!core.loginForm.employee_id || !core.loginForm.password) {
        core.loginError.value = "請輸入帳號與密碼";
        return;
      }


      core.isSubmitting.value = true;


      google.script.run
        .withSuccessHandler((res) => {
          core.isSubmitting.value = false;


          if (res && res.success) {
            core.token.value = res.token;
            core.currentUser.value = res.user;
            core.activeTab.value = "employee";


            const defaultYm = avail.defaultNextMonth.value;
            avail.targetYearMonth.value = defaultYm;
            summary.managerYearMonth.value = defaultYm;
            schedAdmin.scheduleTargetYearMonth.value = defaultYm;
            rosterYearMonth.value = currentYm;
            leave.leaveFilterMonth.value = "";


            nextTick(() => {
              avail.generateCalendar(defaultYm);
              avail.loadAvailabilityOnly(defaultYm);
              loadBootstrapData();
              loadRosterForMonth(rosterYearMonth.value);
              leave.fetchMyLeaves();


              if (core.currentUser.value.role === 'Admin') {
                summary.fetchManagerSummary();
                onScheduleMonthChange();
              }
            });
          } else {
            core.loginError.value = (res && res.message) ? res.message : "登入失敗";
          }
        })
        .withFailureHandler((err) => {
          core.isSubmitting.value = false;
          core.loginError.value = "連線失敗: " + err.message;
        })
        .apiLogin(core.loginForm.employee_id, core.loginForm.password);
    };


    const handleLogout = () => {
      core.token.value = "";
      core.currentUser.value = null;
      core.loginForm.employee_id = "";
      core.loginForm.password = "";
      core.activeTab.value = "employee";
      core.closeStickyAlert();
    };


    const loadBootstrapData = () => {
      if (!core.token.value) return;


      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) {
            avail.colleagueList.value = res.colleagues || [];


            if (res.allStaffList) {
              schedAdmin.allStaffList.value = res.allStaffList;
            }


            if (res.unlockRegistry) {
              schedAdmin.rawUnlockRegistry.value = res.unlockRegistry;
            }
          }
        })
        .apiGetBootstrapData(core.token.value, avail.targetYearMonth.value);
    };


    const loadRosterForMonth = (ym) => {
      const cleanYm = CalendarUtils.normalizeYearMonth(ym);
      isRefreshingRoster.value = true;


      google.script.run
        .withSuccessHandler((res) => {
          isRefreshingRoster.value = false;


          if (res && res.success) {
            roster.myRosterSchedule.value = res.myRosterSchedule || [];
            roster.generateRosterCalendar(cleanYm);
          }
        })
        .withFailureHandler(() => {
          isRefreshingRoster.value = false;
        })
        .apiGetMyRosterSchedule(core.token.value, cleanYm);
    };


    const onRosterMonthChange = () => {
      loadRosterForMonth(rosterYearMonth.value);
    };


    const onYearMonthChange = () => {
      const selectedYm = CalendarUtils.normalizeYearMonth(avail.targetYearMonth.value);
      if (!selectedYm) return;


      avail.generateCalendar(selectedYm);
      avail.loadAvailabilityOnly(selectedYm);
    };


    const onScheduleMonthChange = () => {
      schedAdmin.fetchScheduleData(schedAdmin.scheduleTargetYearMonth.value, false);
    };


    // 呼叫後端排班；若後端回傳警告，開啟固定確認視窗
    const runAutoScheduleRequest = (yearMonth, confirmed) => {
      summary.isAutoScheduling.value = true;


      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.needsConfirmation) {
            summary.isAutoScheduling.value = false;
            autoScheduleConfirmation.value = {
              visible: true,
              yearMonth: yearMonth,
              message: res.message || "此月份有排班或填報狀況需要確認。"
            };
            return;
          }


          summary.isAutoScheduling.value = false;


          if (res && res.success) {
            autoScheduleConfirmation.value.visible = false;
            core.triggerStickyAlert(
              res.message || "智慧排班已完成",
              "success"
            );


            schedAdmin.scheduleTargetYearMonth.value = yearMonth;
            schedAdmin.fetchScheduleData(yearMonth, false);
            summary.fetchManagerSummary();
          } else {
            core.triggerStickyAlert(
              (res && res.message) ? res.message : "智慧排班失敗",
              "error"
            );
          }
        })
        .withFailureHandler((err) => {
          summary.isAutoScheduling.value = false;
          core.triggerStickyAlert(
            "智慧排班連線失敗：" + (err && err.message ? err.message : err),
            "error"
          );
        })
        .apiRunAutoSchedule(core.token.value, yearMonth, confirmed);
    };


    const handleRunAutoSchedule = () => {
      const yearMonth = summary.managerYearMonth.value;


      if (
        !summary.canRunAutoScheduleForManagerMonth.value ||
        core.isSubmitting.value ||
        summary.isAutoScheduling.value
      ) {
        return;
      }


      runAutoScheduleRequest(yearMonth, false);
    };


    const confirmAutoSchedule = () => {
      if (!autoScheduleConfirmation.value.visible) return;


      const yearMonth = autoScheduleConfirmation.value.yearMonth;
      autoScheduleConfirmation.value.visible = false;
      runAutoScheduleRequest(yearMonth, true);
    };


    const cancelAutoSchedule = () => {
      autoScheduleConfirmation.value.visible = false;
      autoScheduleConfirmation.value.yearMonth = "";
      autoScheduleConfirmation.value.message = "";
    };


    const switchToScheduleTab = () => {
      core.activeTab.value = 'schedule';
      onScheduleMonthChange();
    };


    const handleTabSwitch = (tabName) => {
      core.activeTab.value = tabName;


      if (tabName === 'leave') {
        leave.fetchMyLeaves();
      } else if (tabName === 'schedule') {
        onScheduleMonthChange();
      } else if (tabName === 'manager') {
        summary.fetchManagerSummary();
      } else if (tabName === 'employee') {
        onYearMonthChange();
      }
    };


    const handleWindowFocus = () => {
      if (core.token.value && core.activeTab.value === 'leave') {
        leave.fetchMyLeaves();
      }
    };


    onMounted(() => {
      avail.generateCalendar(avail.targetYearMonth.value);


      core.clockTimer = setInterval(() => {
        core.currentTimestamp.value = new Date();
      }, 1000);


      window.addEventListener('focus', handleWindowFocus);
    });


    onUnmounted(() => {
      if (core.clockTimer) clearInterval(core.clockTimer);
      window.removeEventListener('focus', handleWindowFocus);
    });


    return {
      ...core,
      ...avail,
      ...roster,
      ...leave,
      ...summary,
      ...schedAdmin,
      rosterYearMonth,
      isRefreshingRoster,
      allSystemMonths,
      windowedMonths,
      canShiftNewer,
      canShiftOlder,
      shiftWindowNewer,
      shiftWindowOlder,
      isManagerMonthInWindow,
      isRosterMonthInWindow,
      isScheduleMonthInWindow,
      getHolidayInfo,
      handleLogin,
      handleLogout,
      loadBootstrapData,
      onYearMonthChange,
      onRosterMonthChange,
      onLeaveFilterMonthChange: leave.fetchMyShiftsForMonth,
      onScheduleMonthChange,
      handleRunAutoSchedule,
      autoScheduleConfirmation,
      confirmAutoSchedule,
      cancelAutoSchedule,
      switchToScheduleTab,
      handleTabSwitch,
      loadScheduleData: schedAdmin.fetchScheduleData,
      loadManagerData: summary.fetchManagerSummary,
      handleUnlockMonth: schedAdmin.executeUnlockMonth,
      handleSubmitAvailability: avail.submitAvailability,
      handleSubmitLeave: leave.submitLeave,
      handleApproveLeave: schedAdmin.approveLeave,
      handleRejectLeave: schedAdmin.rejectLeave,
      handleRunArchive: schedAdmin.executeArchiveFromSchedule,
      isRecalculating,
      handleRecalculateStats,
    };
  }
}).mount('#app');
</script>
