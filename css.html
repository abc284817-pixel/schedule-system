<style>
 [v-cloak] { display: none; }
 .no-scrollbar::-webkit-scrollbar { display: none; }
 .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

 /* 核心字型統一 */
 body, select, select option, input, button {
   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif !important;
   font-variant-numeric: tabular-nums lining-nums !important;
   -webkit-font-feature-settings: "tnum" 1, "lnum" 1 !important;
   font-feature-settings: "tnum" 1, "lnum" 1 !important;
   letter-spacing: normal !important;
 }

 /* 💥 針對手機端螢幕強制 input 為 16px，徹底解決 iOS / Android 彈出鍵盤畫面被強迫擴大的痛點 */
 @media (max-width: 767px) {
   input[type="text"],
   input[type="password"],
   input[type="number"],
   input[type="email"],
   textarea,
   select {
     font-size: 16px !important;
   }
 }

 /* 側邊抽屜平滑滑入動畫 */
 @keyframes slideRight {
   from { transform: translateX(-100%); }
   to { transform: translateX(0); }
 }
 .animate-slide-right {
   animation: slideRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
 }
</style>
